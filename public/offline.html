<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sem ligação · Rodagem</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #f6f7f9; color: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .cartao { background: #fff; border: 1px solid #e5e8ee; border-radius: 14px; padding: 28px; max-width: 380px; text-align: center; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: #64748b; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; background: #2453c7; color: #fff; border: 0; border-radius: 10px; min-height: 46px; padding: 0 22px; cursor: pointer; }
</style>
</head>
<body>
  <div class="cartao">
    <img src="/icon.svg" width="48" height="48" alt="">
    <h1>Sem ligação à internet</h1>
    <p>O Rodagem precisa de rede para mostrar os serviços e prazos atualizados. Tenta outra vez quando tiveres sinal.</p>
    <button type="button" onclick="location.reload()">Tentar outra vez</button>
  </div>
</body>
</html>
