# Infraestrutura do Rodagem no Render (região UE, plano gratuito).
# Para passar ao pago: plan: starter no serviço, basic_256mb na base de dados,
# e acrescentar um Cron Job que chame /api/cron/alertas.
services:
  - type: web
    name: rodagem
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rodagem-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false

databases:
  - name: rodagem-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "18"
