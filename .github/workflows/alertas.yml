# Resumo diário de prazos (plano gratuito do Render, que não tem Cron Jobs).
# Configura em Settings → Secrets and variables → Actions:
#   RODAGEM_URL  — ex.: https://rodagem.onrender.com
#   CRON_SECRET  — o mesmo valor da variável CRON_SECRET no Render
# Quando passares ao plano pago, troca isto por um Cron Job do Render.
name: Alertas diários

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC, todos os dias
  workflow_dispatch:

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron/alertas
        env:
          RODAGEM_URL: ${{ secrets.RODAGEM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RODAGEM_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Segredos RODAGEM_URL e CRON_SECRET não configurados; nada a fazer."
            exit 0
          fi
          # O serviço gratuito pode estar a dormir: acordá-lo primeiro.
          curl -s -o /dev/null --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 "$RODAGEM_URL/api/health" || true
          curl -fsS --max-time 120 -X POST "$RODAGEM_URL/api/cron/alertas" \
            -H "Authorization: Bearer $CRON_SECRET"
